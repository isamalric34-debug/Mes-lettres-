<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes mots pour vous</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #F5F0E8;
    --fond2: #EDE7DA;
    --blanc: #FDFAF5;
    --noir: #1C1A17;
    --noir-doux: #2E2B26;
    --or: #A8894A;
    --or-light: #C9A96E;
    --or-pale: #E8D9B8;
    --texte: #2A2520;
    --texte-doux: #5A5248;
    --bordure: rgba(168,137,74,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--fond);
    color: var(--texte);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 10% 5%, rgba(168,137,74,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 95%, rgba(168,137,74,0.05) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 3rem 2rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 2rem;
    animation: fadeDown 1.2s ease both;
  }

  .ornament {
    color: var(--or);
    font-size: 1.1rem;
    letter-spacing: 0.6em;
    opacity: 0.5;
    display: block;
    margin-bottom: 0.8rem;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.3rem, 4vw, 1.9rem);
    font-weight: 400;
    color: var(--noir);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1.3;
  }

  .subtitle {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    color: var(--texte-doux);
    font-size: 1rem;
    margin-top: 0.7rem;
  }

  .divider {
    width: 180px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--or), transparent);
    margin: 1.5rem auto;
    opacity: 0.5;
  }

  /* Onglets principaux */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 2rem;
    width: 100%;
    border-bottom: 1px solid var(--bordure);
    animation: fadeUp 1s ease 0.2s both;
  }

  .tab-btn {
    background: none;
    border: none;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--texte-doux);
    padding: 0.9rem 1.8rem;
    cursor: pointer;
    opacity: 0.5;
    transition: all 0.3s;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .tab-btn.active {
    opacity: 1;
    color: var(--noir);
    border-bottom-color: var(--or);
  }

  /* Panneau écriture */
  .panel { width: 100%; display: none; }
  .panel.active { display: block; }

  .recipient-selector {
    display: flex;
    gap: 1.2rem;
    margin-bottom: 2rem;
    animation: fadeUp 1s ease 0.3s both;
  }

  .recipient-btn {
    background: var(--blanc);
    border: 1px solid var(--bordure);
    color: var(--texte-doux);
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.9rem 2rem;
    cursor: pointer;
    transition: all 0.35s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(42,37,32,0.04);
  }

  .recipient-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--noir);
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .recipient-btn span { position: relative; z-index: 1; transition: color 0.35s ease; }
  .recipient-btn.active::before { opacity: 1; }
  .recipient-btn.active span { color: var(--or-pale); }
  .recipient-btn.active { border-color: var(--noir); }
  .recipient-btn:hover:not(.active) { border-color: var(--or-light); background: var(--fond2); }

  .amorce-card {
    width: 100%;
    background: var(--blanc);
    border: 1px solid var(--bordure);
    padding: 1.8rem 2.2rem;
    margin-bottom: 1.8rem;
    position: relative;
    box-shadow: 0 4px 24px rgba(42,37,32,0.05);
  }

  .amorce-card::before, .amorce-card::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border-color: var(--or);
    border-style: solid;
    opacity: 0.4;
  }
  .amorce-card::before { top:-1px; left:-1px; border-width:1px 0 0 1px; }
  .amorce-card::after  { bottom:-1px; right:-1px; border-width:0 1px 1px 0; }

  .amorce-label {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--or);
    opacity: 0.8;
    margin-bottom: 0.9rem;
    display: block;
  }

  .amorce-text {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.75;
    color: var(--texte);
    transition: opacity 0.3s ease;
  }
  .amorce-text.fade { opacity: 0; }

  .amorce-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 1rem;
  }

  .btn-new-amorce {
    background: none; border: none;
    color: var(--or);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer; opacity: 0.6;
    transition: opacity 0.3s;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .btn-new-amorce:hover { opacity: 1; }

  .writing-area { width: 100%; }

  .writing-area label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--texte-doux);
    opacity: 0.7;
    margin-bottom: 0.7rem;
  }

  .date-line {
    text-align: right;
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--texte-doux);
    opacity: 0.5;
    margin-bottom: 0.6rem;
  }

  textarea {
    width: 100%;
    min-height: 260px;
    background: var(--blanc);
    border: 1px solid var(--bordure);
    color: var(--texte);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    line-height: 1.9;
    padding: 1.4rem 1.6rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    caret-color: var(--or);
    box-shadow: 0 2px 16px rgba(42,37,32,0.04);
  }
  textarea::placeholder { color: rgba(90,82,72,0.3); font-style: italic; }
  textarea:focus { border-color: rgba(168,137,74,0.45); box-shadow: 0 4px 24px rgba(168,137,74,0.08); }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.4rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .counter {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem;
    color: var(--texte-doux);
    opacity: 0.5;
    letter-spacing: 0.08em;
  }

  .btn-save {
    background: var(--noir);
    border: 1px solid var(--noir);
    color: var(--or-pale);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 0.95rem 2rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-save:hover { background: var(--noir-doux); border-color: var(--or); color: var(--or-light); }

  .btn-copy {
    background: none;
    border: 1px solid var(--bordure);
    color: var(--texte-doux);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    padding: 0.75rem 1.4rem;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-copy:hover { border-color: var(--or-light); color: var(--texte); }

  /* ===== PANNEAU ARCHIVE ===== */
  .archive-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 0.8rem;
  }

  .archive-filter {
    display: flex;
    gap: 0.6rem;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--bordure);
    color: var(--texte-doux);
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.5rem 1.1rem;
    cursor: pointer;
    transition: all 0.3s;
  }
  .filter-btn.active { background: var(--noir); color: var(--or-pale); border-color: var(--noir); }
  .filter-btn:hover:not(.active) { border-color: var(--or-light); }

  .archive-empty {
    text-align: center;
    font-family: 'IM Fell English', serif;
    font-style: italic;
    color: var(--texte-doux);
    opacity: 0.5;
    font-size: 1.05rem;
    padding: 3rem 0;
  }

  .letter-card {
    background: var(--blanc);
    border: 1px solid var(--bordure);
    padding: 1.4rem 1.8rem;
    margin-bottom: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    box-shadow: 0 2px 10px rgba(42,37,32,0.03);
  }
  .letter-card:hover { border-color: var(--or-light); box-shadow: 0 4px 18px rgba(42,37,32,0.07); }

  .letter-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.6rem;
  }

  .letter-card-dest {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--or);
  }

  .letter-card-date {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 0.85rem;
    color: var(--texte-doux);
    opacity: 0.6;
  }

  .letter-card-preview {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--texte);
    opacity: 0.7;
    line-height: 1.6;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  /* Modale de lecture */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28,26,23,0.7);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--blanc);
    border: 1px solid var(--bordure);
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 2.5rem 2.5rem 2rem;
    position: relative;
    box-shadow: 0 20px 60px rgba(28,26,23,0.25);
    animation: fadeUp 0.3s ease both;
  }

  .modal-close {
    position: absolute;
    top: 1.2rem; right: 1.4rem;
    background: none; border: none;
    font-size: 1.4rem;
    color: var(--texte-doux);
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s;
    line-height: 1;
  }
  .modal-close:hover { opacity: 0.9; }

  .modal-dest {
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--or);
    margin-bottom: 0.3rem;
  }

  .modal-date {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    color: var(--texte-doux);
    opacity: 0.6;
    font-size: 0.9rem;
    margin-bottom: 1.4rem;
  }

  .modal-amorce {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--texte-doux);
    border-left: 2px solid var(--or);
    padding-left: 1rem;
    margin-bottom: 1.4rem;
    opacity: 0.75;
    line-height: 1.6;
  }

  .modal-body {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    line-height: 1.9;
    color: var(--texte);
    white-space: pre-wrap;
  }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--bordure);
  }

  .btn-delete {
    background: none;
    border: 1px solid rgba(160,60,60,0.25);
    color: rgba(160,60,60,0.6);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    padding: 0.7rem;
    cursor: pointer;
    transition: all 0.3s;
    width: 100%;
    text-align: center;
  }
  .btn-delete:hover { background: rgba(160,60,60,0.05); border-color: rgba(160,60,60,0.5); color: rgba(160,60,60,0.9); }

  .btn-print {
    background: none;
    border: 1px solid var(--bordure);
    color: var(--texte-doux);
    font-family: Cormorant Garamond, serif;
    font-size: 0.85rem;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    transition: all 0.3s;
  }
  .btn-print:hover { border-color: var(--or-light); color: var(--texte); }

  @media print {
    body > *:not(#print-zone) { display: none !important; }
    #print-zone { display: block !important; padding: 2.5cm; font-family: Georgia, serif; color: #1C1A17; }
    #print-dest { font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: #A8894A; margin-bottom: 0.3rem; }
    #print-date { font-style: italic; font-size: 0.9rem; color: #5A5248; margin-bottom: 1.5rem; }
    #print-amorce { font-style: italic; font-size: 1rem; color: #5A5248; border-left: 2px solid #A8894A; padding-left: 1rem; margin-bottom: 1.8rem; line-height: 1.6; }
    #print-body { font-size: 1.05rem; line-height: 1.9; white-space: pre-wrap; }
    #print-signature { margin-top: 2.5rem; font-style: italic; color: #5A5248; }
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(3rem);
    background: var(--noir);
    border: 1px solid rgba(168,137,74,0.3);
    color: var(--or-pale);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    padding: 0.8rem 2rem;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
    z-index: 300;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fadeDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp   { from{opacity:0;transform:translateY(20px)}  to{opacity:1;transform:translateY(0)} }

  @media (max-width: 500px) {
    .container { padding: 1.8rem 1rem; }
    .recipient-selector { gap: 0.7rem; }
    .recipient-btn { padding: 0.75rem 1rem; font-size: 0.68rem; }
    .amorce-card { padding: 1.3rem 1rem; }
    .amorce-text { font-size: 1.05rem; }
    .modal { padding: 2rem 1.2rem 1.5rem; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <span class="ornament">✦ ✦ ✦</span>
    <h1>Mes mots pour vous</h1>
    <p class="subtitle">Une lettre par jour, pour toujours</p>
    <div class="divider"></div>
  </header>

  <!-- Onglets -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('ecrire')">✦ Écrire</button>
    <button class="tab-btn" onclick="showTab('archive')" id="tab-archive">Mes lettres</button>
  </div>

  <!-- Panneau écriture -->
  <div class="panel active" id="panel-ecrire">
    <div class="recipient-selector">
      <button class="recipient-btn active" onclick="setRecipient('lily')" id="btn-lily">
        <span>Pour Lily</span>
      </button>
      <button class="recipient-btn" onclick="setRecipient('bebe')" id="btn-bebe">
        <span>Pour le bébé</span>
      </button>
    </div>

    <div class="amorce-card">
      <span class="amorce-label">✦ Amorce du jour</span>
      <p class="amorce-text" id="amorce-text">Chargement...</p>
      <div class="amorce-actions">
        <button class="btn-new-amorce" onclick="newAmorce()">↻ &nbsp;Une autre amorce</button>
      </div>
    </div>

    <div class="writing-area">
      <div class="date-line" id="date-line"></div>
      <label>Votre lettre</label>
      <textarea id="letter-text" placeholder="Commencez à écrire… ces mots sont les vôtres."></textarea>
    </div>

    <div class="actions">
      <span class="counter" id="char-count">0 mot</span>
      <div style="display:flex;gap:0.8rem;flex-wrap:wrap;">
        <button class="btn-copy" onclick="copyText()">Copier</button>
        <button class="btn-save" onclick="saveLetter()">↓ &nbsp;Sauvegarder</button>
      </div>
    </div>
  </div>

  <!-- Panneau archive -->
  <div class="panel" id="panel-archive">
    <div class="archive-header">
      <div class="archive-filter">
        <button class="filter-btn active" onclick="setFilter('all')" id="filter-all">Toutes</button>
        <button class="filter-btn" onclick="setFilter('lily')" id="filter-lily">Lily</button>
        <button class="filter-btn" onclick="setFilter('bebe')" id="filter-bebe">Le bébé</button>
      </div>
      <span class="counter" id="archive-count"></span>
    </div>
    <div id="archive-list"></div>
  </div>

</div>

<!-- Modale lecture -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-dest" id="modal-dest"></div>
    <div class="modal-date" id="modal-date"></div>
    <div class="modal-amorce" id="modal-amorce"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-print" onclick="printLetter()">Télécharger la lettre</button>
      <button class="btn-delete" onclick="deleteLetter()">Supprimer cette lettre</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="print-zone" style="display:none;"><div id="print-dest"></div><div id="print-date"></div><div id="print-amorce"></div><div id="print-body"></div><div id="print-signature">— Maman / Mamie</div></div>

<script>
const AMORCES = {
  lily: [
    "Le jour où tu es née, j'ai su que rien ne serait plus jamais pareil. Ce que j'ai ressenti, c'était…",
    "Quand tu étais toute petite et que tu dormais, je venais te regarder respirer. Je pensais…",
    "Le premier mot que tu as dit, c'était… Et moi j'ai…",
    "Il y a une odeur qui me ramène toujours à toi enfant. C'est…",
    "Quand tu pleurais et que je ne savais pas pourquoi, ce que je faisais pour te calmer, c'était…",
    "Ta façon de rire quand tu étais petite — ce rire-là — il ressemblait à…",
    "Le jouet, le doudou, l'objet que tu aimais par-dessus tout, c'était… et tu le tenais comme…",
    "La première fois que tu as marché, j'ai eu envie de…",
    "Quand tu avais peur la nuit et que tu venais me rejoindre, je…",
    "Il y a une image de toi enfant que je n'oublierai jamais. Tu étais…",
    "Ce que j'admire le plus en toi, et que tu ne vois peut-être pas toi-même, c'est…",
    "Tu as toujours eu un caractère bien à toi. Ce qui me frappait le plus, c'était…",
    "Quand tu étais en colère, tu avais une façon de… qui me faisait à la fois sourire et…",
    "La chose qui te rendait le plus heureuse quand tu étais enfant, c'était…",
    "Tu as hérité de moi certaines choses. D'autres, tu les as inventées toi-même. Ce qui vient de toi seule, c'est…",
    "Ce que je trouvais extraordinaire en toi, c'est que tu as toujours su…",
    "Tu étais du genre à… et ça me disait déjà tout de la femme que tu allais devenir.",
    "Parfois tu me surprenais tellement que je devais sortir de la pièce pour…",
    "La chose la plus courageuse que tu aies jamais faite, à mes yeux, c'est…",
    "Il y avait en toi une lumière particulière quand tu… Je l'ai toujours vue.",
    "Si je pouvais revenir à un seul moment passé avec toi, ce serait…",
    "Il y a un endroit qu'on aimait toutes les deux. Je pense souvent à…",
    "Une chose qu'on faisait ensemble et que j'adorais, c'était…",
    "Je me souviens d'un soir particulier avec toi. On était…",
    "Il y a une chanson qui me ramène toujours à un moment avec toi. C'est… parce que…",
    "Le repas que tu préférais et que je faisais rien que pour toi, c'était…",
    "On a ri ensemble comme des folles une fois à propos de… Je m'en souviens encore.",
    "Le voyage, la sortie, le moment hors du quotidien qu'on a vécu ensemble et que je chéris, c'est…",

let currentRecipient = 'lily';
let usedIndexes = { lily: [], bebe: [] };
let autoSaveTimer = null;
let currentFilter = 'all';
let currentModalKey = null;

// ===== STOCKAGE =====
const DRAFT_KEYS = {
  text:   r => `draft_text_${r}`,
  amorce: r => `draft_amorce_${r}`,
  date:   r => `draft_date_${r}`
};

const ARCHIVE_KEY = 'lettres_archive';

function getArchive() {
  try { return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'); }
  catch(e) { return []; }
}

function saveArchive(arr) {
  try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arr)); } catch(e) {}
}

// ===== BROUILLON =====
function saveDraft() {
  const text = document.getElementById('letter-text').value;
  const amorce = document.getElementById('amorce-text').textContent;
  const today = new Date().toISOString().slice(0,10);
  try {
    localStorage.setItem(DRAFT_KEYS.text(currentRecipient), text);
    localStorage.setItem(DRAFT_KEYS.amorce(currentRecipient), amorce);
    localStorage.setItem(DRAFT_KEYS.date(currentRecipient), today);
  } catch(e) {}
  updateSaveIndicator(true);
}

function loadDraft(r) {
  try {
    const text = localStorage.getItem(DRAFT_KEYS.text(r)) || '';
    const amorce = localStorage.getItem(DRAFT_KEYS.amorce(r));
    document.getElementById('letter-text').value = text;
    updateWordCount();
    if (amorce) {
      document.getElementById('amorce-text').textContent = amorce;
    } else {
      newAmorce();
    }
    if (text) updateSaveIndicator(true);
  } catch(e) { newAmorce(); }
}

// ===== SAUVEGARDE DÉFINITIVE =====
function saveLetter() {
  const text = document.getElementById('letter-text').value.trim();
  if (!text) { showToast('Écris quelques mots d\'abord…'); return; }

  const amorce = document.getElementById('amorce-text').textContent;
  const now = new Date();
  const dateISO = now.toISOString().slice(0,10);
  const dateFR = formatDate();

  const archive = getArchive();

  // Chercher si une lettre existe déjà pour ce destinataire ce jour
  const existingIdx = archive.findIndex(l => l.dest === currentRecipient && l.dateISO === dateISO);
  const entry = { dest: currentRecipient, dateISO, dateFR, amorce, text, id: Date.now() };

  if (existingIdx >= 0) {
    archive[existingIdx] = entry;
  } else {
    archive.unshift(entry);
  }

  saveArchive(archive);
  // Vider et régénérer après sauvegarde
  localStorage.removeItem('draft_text_' + currentRecipient);
  localStorage.removeItem('draft_amorce_' + currentRecipient);
  document.getElementById('letter-text').value = '';
  updateWordCount();
  newAmorce();
  showToast('Lettre sauvegardée ✦');
}

// ===== ONGLETS =====
function showTab(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  event.target.classList.add('active');
  if (tab === 'archive') renderArchive();
}

// ===== DESTINATAIRE =====
function setRecipient(r) {
  if (r === currentRecipient) return;
  saveDraft();
  currentRecipient = r;
  document.getElementById('btn-lily').classList.toggle('active', r === 'lily');
  document.getElementById('btn-bebe').classList.toggle('active', r === 'bebe');
  document.getElementById('letter-text').value = '';
  updateWordCount();
  loadDraft(r);
}

// ===== AMORCE =====
function getRandomAmorce(r) {
  const list = AMORCES[r];
  if (usedIndexes[r].length >= list.length) usedIndexes[r] = [];
  const remaining = list.map((_,i) => i).filter(i => !usedIndexes[r].includes(i));
  const idx = remaining[Math.floor(Math.random() * remaining.length)];
  usedIndexes[r].push(idx);
  return list[idx];
}

function newAmorce() {
  const el = document.getElementById('amorce-text');
  el.classList.add('fade');
  setTimeout(() => {
    el.textContent = getRandomAmorce(currentRecipient);
    el.classList.remove('fade');
  }, 300);
}

// ===== ARCHIVE =====
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('filter-' + f).classList.add('active');
  renderArchive();
}

function renderArchive() {
  const archive = getArchive();
  const filtered = currentFilter === 'all' ? archive : archive.filter(l => l.dest === currentFilter);
  const list = document.getElementById('archive-list');
  const count = document.getElementById('archive-count');

  count.textContent = filtered.length + ' lettre' + (filtered.length > 1 ? 's' : '');

  if (filtered.length === 0) {
    list.innerHTML = '<div class="archive-empty">Aucune lettre pour le moment…</div>';
    return;
  }

  list.innerHTML = filtered.map((l, i) => `
    <div class="letter-card" onclick="openModal(${archive.indexOf(l)})">
      <div class="letter-card-header">
        <span class="letter-card-dest">${l.dest === 'lily' ? 'Pour Lily' : 'Pour le bébé'}</span>
        <span class="letter-card-date">${l.dateFR}</span>
      </div>
      <div class="letter-card-preview">${escHtml(l.text)}</div>
    </div>
  `).join('');
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== MODALE =====
function openModal(idx) {
  const archive = getArchive();
  const l = archive[idx];
  if (!l) return;
  currentModalKey = idx;
  document.getElementById('modal-dest').textContent = l.dest === 'lily' ? 'Pour Lily' : 'Pour le bébé';
  document.getElementById('modal-date').textContent = l.dateFR;
  document.getElementById('modal-amorce').textContent = l.amorce;
  document.getElementById('modal-body').textContent = l.text;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  currentModalKey = null;
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function deleteLetter() {
  if (currentModalKey === null) return;
  if (!confirm('Supprimer cette lettre définitivement ?')) return;
  const archive = getArchive();
  archive.splice(currentModalKey, 1);
  saveArchive(archive);
  closeModal();
  renderArchive();
  showToast('Lettre supprimée');
}

// ===== UTILITAIRES =====
function formatDate() {
  const d = new Date();
  const jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return `${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]} ${d.getFullYear()}`;
}

function updateWordCount() {
  const text = document.getElementById('letter-text').value;
  const w = text.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('char-count').textContent = w === 0 ? '0 mot' : w === 1 ? '1 mot' : `${w} mots`;
}

function updateSaveIndicator(saved) {
  const counter = document.getElementById('char-count');
  const text = document.getElementById('letter-text').value;
  const w = text.trim().split(/\s+/).filter(Boolean).length;
  const label = w === 0 ? '0 mot' : w === 1 ? '1 mot' : `${w} mots`;
  counter.textContent = saved ? label + ' — sauvegardé ✦' : label + ' — non sauvegardé…';
  counter.style.opacity = saved ? '0.5' : '0.9';
}

document.getElementById('letter-text').addEventListener('input', function() {
  updateSaveIndicator(false);
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => { saveDraft(); }, 1500);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function copyText() {
  const text = document.getElementById('letter-text').value;
  if (!text.trim()) { showToast('Rien à copier encore…'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('Texte copié ✦'));
}

function printLetter() {
  const archive = getArchive();
  const l = archive[currentModalKey];
  if (!l) return;

  const dest = l.dest === 'lily' ? 'Pour Lily' : 'Pour le bébé';
  const dateFile = l.dateISO || new Date().toISOString().slice(0,10);
  const filename = 'lettre-' + l.dest + '-' + dateFile + '.html';

  const html = `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${dest} — ${l.dateFR}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
  body { background: #F5F0E8; margin: 0; padding: 0; font-family: 'Cormorant Garamond', Georgia, serif; }
  .page { max-width: 600px; margin: 0 auto; padding: 3rem 2rem 4rem; min-height: 100vh; }
  .ornament { color: #A8894A; font-size: 1rem; letter-spacing: 0.6em; opacity: 0.5; text-align: center; display: block; margin-bottom: 2rem; }
  .dest { font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: #A8894A; margin-bottom: 0.3rem; }
  .date { font-family: 'IM Fell English', serif; font-style: italic; font-size: 0.9rem; color: #5A5248; margin-bottom: 2rem; }
  .divider { border: none; height: 1px; background: linear-gradient(90deg, transparent, #A8894A, transparent); opacity: 0.4; margin: 1.5rem 0; }
  .amorce { font-family: 'IM Fell English', serif; font-style: italic; font-size: 1.05rem; color: #5A5248; border-left: 2px solid #A8894A; padding-left: 1.2rem; margin-bottom: 2rem; line-height: 1.7; opacity: 0.85; }
  .body { font-size: 1.1rem; line-height: 1.9; color: #2A2520; white-space: pre-wrap; margin-bottom: 2.5rem; }
  .signature { font-family: 'IM Fell English', serif; font-style: italic; color: #5A5248; font-size: 0.95rem; text-align: right; }
  @media print {
    body { background: white; }
    .page { padding: 2cm; }
  }
</style>
</head>
<body>
<div class="page">
  <span class="ornament">✦ ✦ ✦</span>
  <div class="dest">${dest}</div>
  <div class="date">${l.dateFR}</div>
  <hr class="divider">
  <div class="amorce">${l.amorce}</div>
  <div class="body">${l.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
  <div class="signature">— Maman / Mamie</div>
</div>
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Lettre téléchargée ✦');
}

// Init
document.getElementById('date-line').textContent = formatDate();
loadDraft(currentRecipient);
</script>
</body>
</html>
